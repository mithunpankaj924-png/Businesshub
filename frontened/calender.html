<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BusinessHub | Calendar</title>

    <link
        rel="stylesheet"
        href="calender.css"
    >

    <script
        src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
    ></script>

</head>


<body>

<div class="calendar-page">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img
                src="./images/company logo.png"
                alt="BusinessHub Logo"
            >

        </div>


        <nav class="sidebar-nav">

            <a
                href="dashboard.html"
                class="nav-item"
            >

                <i data-lucide="layout-dashboard"></i>

                Dashboard

            </a>


            <a
                href="customer.html"
                class="nav-item"
            >

                <i data-lucide="users"></i>

                Customers

            </a>


            <a
                href="appointments.html"
                class="nav-item"
            >

                <i data-lucide="calendar-check"></i>

                Appointments

            </a>


            <a
                href="calender.html"
                class="nav-item active"
            >

                <i data-lucide="calendar-days"></i>

                Calendar

            </a>


            <a
                href="./staff.html"
                class="nav-item"
            >

                <i data-lucide="user-round"></i>

                Staff

            </a>


            <a
                href="./service.html"
                class="nav-item"
            >

                <i data-lucide="sparkles"></i>

                Services

            </a>


            <a
                href="./reports.html"
                class="nav-item"
            >

                <i data-lucide="bar-chart-3"></i>

                Reports

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="./setting.html"
                class="nav-item"
            >

                <i data-lucide="settings"></i>

                Settings

            </a>


            <a
                href="index.html"
                class="nav-item"
            >

                <i data-lucide="log-out"></i>

                Sign out

            </a>

        </div>

    </aside>



    <!-- MAIN CONTENT -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="search-box">

                <i data-lucide="search"></i>

                <input
                    type="text"
                    placeholder="Search..."
                >

            </div>


            <div class="owner-section">

                <button class="notification">

                    <i data-lucide="bell"></i>

                </button>


                <div class="owner-info">

                    <strong>Owner</strong>

                    <small>Business Owner</small>

                </div>

            </div>

        </header>



        <!-- CONTENT -->

        <section class="content">


            <div class="page-heading">

                <div>

                    <h1>Calendar</h1>

                    <p>
                        View and manage your business schedule.
                    </p>

                </div>


                <button
                    class="today-button"
                    id="todayButton"
                >

                    <i data-lucide="calendar-check"></i>

                    Today

                </button>

            </div>



            <!-- CALENDAR CARD -->

            <section class="calendar-card">


                <!-- CALENDAR HEADER -->

                <div class="calendar-header">


                    <div class="month-navigation">

                        <button
                            id="previousMonth"
                            class="month-button"
                        >

                            <i data-lucide="chevron-left"></i>

                        </button>


                        <h2 id="currentMonth">
                            August 2026
                        </h2>


                        <button
                            id="nextMonth"
                            class="month-button"
                        >

                            <i data-lucide="chevron-right"></i>

                        </button>

                    </div>


                    <div class="calendar-legend">

                        <span>

                            <i class="legend-dot confirmed-dot"></i>

                            Confirmed

                        </span>


                        <span>

                            <i class="legend-dot pending-dot"></i>

                            Pending

                        </span>

                    </div>

                </div>



                <!-- DAYS -->

                <div class="calendar-weekdays">

                    <div>Sun</div>

                    <div>Mon</div>

                    <div>Tue</div>

                    <div>Wed</div>

                    <div>Thu</div>

                    <div>Fri</div>

                    <div>Sat</div>

                </div>



                <!-- CALENDAR GRID -->

                <div
                    class="calendar-grid"
                    id="calendarGrid"
                >

                </div>


            </section>



            <!-- SELECTED DATE -->

            <section class="selected-day-card">

                <div class="selected-day-header">

                    <div>

                        <h2 id="selectedDateTitle">
                            Appointments
                        </h2>

                        <p id="selectedDateSubtitle">
                            Select a date to view appointments.
                        </p>

                    </div>


                    <button
                        class="add-button"
                        id="addAppointmentButton"
                    >

                        <i data-lucide="plus"></i>

                        Add Appointment

                    </button>

                </div>


                <div
                    class="day-appointments"
                    id="dayAppointments"
                >

                </div>

            </section>


        </section>

    </main>

</div>



<script>

    lucide.createIcons();


    // =========================
    // CALENDAR VARIABLES
    // =========================

    let currentDate =
        new Date();


    let selectedDate =
        new Date();



    const calendarGrid =
        document.getElementById(
            "calendarGrid"
        );


    const currentMonthElement =
        document.getElementById(
            "currentMonth"
        );


    const selectedDateTitle =
        document.getElementById(
            "selectedDateTitle"
        );


    const selectedDateSubtitle =
        document.getElementById(
            "selectedDateSubtitle"
        );


    const dayAppointments =
        document.getElementById(
            "dayAppointments"
        );



    // =========================
    // DATE HELPERS
    // =========================

    function formatDate(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }



    function formatDisplayDate(date) {

        return date.toLocaleDateString(
            "en-GB",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    }



    // =========================
    // LOAD APPOINTMENTS
    // =========================

    function getAppointments() {

        return JSON.parse(
            localStorage.getItem(
                "businesshub_appointments"
            )
        ) || [];

    }



    // =========================
    // RENDER CALENDAR
    // =========================

    function renderCalendar() {

        calendarGrid.innerHTML = "";


        const year =
            currentDate.getFullYear();


        const month =
            currentDate.getMonth();


        const firstDay =
            new Date(
                year,
                month,
                1
            ).getDay();


        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        currentMonthElement.textContent =
            currentDate.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        // Empty cells before first day

        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            const emptyCell =
                document.createElement(
                    "div"
                );

            emptyCell.className =
                "calendar-day empty";

            calendarGrid.appendChild(
                emptyCell
            );

        }


        const appointments =
            getAppointments();


        // Days

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const date =
                new Date(
                    year,
                    month,
                    day
                );


            const dateString =
                formatDate(date);


const dayAppointments =
    appointments.filter(
        function(appointment) {

            return (
                appointment.date ===
                    dateString
                &&
                appointment.status !==
                    "Cancelled"
                &&
                appointment.status !==
                    "Completed"
            );

        }
    );




            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "calendar-day";


            if (
                dateString ===
                formatDate(
                    new Date()
                )
            ) {

                cell.classList.add(
                    "today"
                );

            }


            if (
                dateString ===
                formatDate(
                    selectedDate
                )
            ) {

                cell.classList.add(
                    "selected"
                );

            }


            cell.innerHTML = `

                <div class="day-number">
                    ${day}
                </div>

            `;


            if (
                dayAppointments.length > 0
            ) {

                const appointmentCount =
                    document.createElement(
                        "div"
                    );


                appointmentCount.className =
                    "appointment-count";


                appointmentCount.textContent =
                    dayAppointments.length === 1
                    ? "1 appointment"
                    : `${dayAppointments.length} appointments`;


                cell.appendChild(
                    appointmentCount
                );


                const dots =
                    document.createElement(
                        "div"
                    );


                dots.className =
                    "appointment-dots";


                dayAppointments
                    .slice(0, 3)
                    .forEach(
                        function(appointment) {

                            const dot =
                                document.createElement(
                                    "span"
                                );


                            dot.className =
                                appointment.status ===
                                "Pending"
                                ? "pending-dot"
                                : "confirmed-dot";


                            dots.appendChild(
                                dot
                            );

                        }
                    );


                cell.appendChild(
                    dots
                );

            }


            cell.addEventListener(
                "click",
                function() {

                    selectedDate =
                        new Date(
                            year,
                            month,
                            day
                        );

                    renderCalendar();

                    showSelectedDay();

                }
            );


            calendarGrid.appendChild(
                cell
            );

        }

    }



    // =========================
    // SHOW SELECTED DAY
    // =========================

    function showSelectedDay() {

        selectedDateTitle.textContent =
            formatDisplayDate(
                selectedDate
            );


        selectedDateSubtitle.textContent =
            "Appointments for this date";


        dayAppointments.innerHTML =
            "";


        const appointments =
            getAppointments();


        const selectedAppointments =
            appointments.filter(
                function(appointment) {

                    return (
                        appointment.date ===
                        formatDate(
                            selectedDate
                        )
                    );

                }
            );


        if (
            selectedAppointments.length === 0
        ) {

            dayAppointments.innerHTML = `

                <div class="no-appointments">

                    <i data-lucide="calendar-x"></i>

                    <h3>
                        No appointments
                    </h3>

                    <p>
                        There are no appointments
                        scheduled for this date.
                    </p>

                </div>

            `;


            lucide.createIcons();

            return;

        }


        selectedAppointments.forEach(
            function(appointment) {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "day-appointment";


                item.innerHTML = `

                    <div class="day-appointment-time">

                        <strong>
                            ${formatTime(
                                appointment.time
                            )}
                        </strong>

                        <span>
                            ${appointment.duration}
                            min
                        </span>

                    </div>


                    <div class="day-appointment-customer">

                        <div class="avatar">

                            ${appointment.customerName
                                .charAt(0)
                                .toUpperCase()}

                        </div>


                        <div>

                            <strong>
                                ${appointment.customerName}
                            </strong>

                            <span>
                                ${appointment.customerPhone}
                            </span>

                        </div>

                    </div>


                    <div class="day-appointment-service">

                        <strong>
                            ${appointment.service}
                        </strong>

                        <span>
                            ${appointment.staff}
                        </span>

                    </div>


                    <span
                        class="status ${
                            appointment.status ===
                            "Pending"
                            ? "pending"
                            : "confirmed"
                        }"
                    >

                        ${appointment.status}

                    </span>

                `;


                dayAppointments.appendChild(
                    item
                );

            }
        );

    }



    // =========================
    // FORMAT TIME
    // =========================

    function formatTime(time) {

        const parts =
            time.split(":");


        let hour =
            parseInt(
                parts[0]
            );


        const minute =
            parts[1];


        const ampm =
            hour >= 12
            ? "PM"
            : "AM";


        hour =
            hour % 12 || 12;


        return `${hour}:${minute} ${ampm}`;

    }



    // =========================
    // PREVIOUS MONTH
    // =========================

    document
        .getElementById(
            "previousMonth"
        )
        .addEventListener(
            "click",
            function() {

                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

                renderCalendar();

            }
        );



    // =========================
    // NEXT MONTH
    // =========================

    document
        .getElementById(
            "nextMonth"
        )
        .addEventListener(
            "click",
            function() {

                currentDate.setMonth(
                    currentDate.getMonth() + 1
                );

                renderCalendar();

            }
        );



    // =========================
    // TODAY
    // =========================

    document
        .getElementById(
            "todayButton"
        )
        .addEventListener(
            "click",
            function() {

                currentDate =
                    new Date();

                selectedDate =
                    new Date();

                renderCalendar();

                showSelectedDay();

            }
        );



    // =========================
    // ADD APPOINTMENT
    // =========================
document
    .getElementById(
        "addAppointmentButton"
    )
    .addEventListener(
        "click",
        function() {

            const selectedDateString =
                formatDate(selectedDate);

            window.location.href =
                "appointments.html?date=" +
                selectedDateString;

        }
    );



    // =========================
    // INITIAL LOAD
    // =========================

    renderCalendar();

    showSelectedDay();

</script>

</body>

</html>
