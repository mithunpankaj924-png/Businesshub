<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusinessHub | Manage • Grow • Sustain</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

          <div class="brand">
    <img
        src="./images/company logo.png"
        alt="BusinessHub Logo"
        class="businesshub-logo"
    >
</div>

            <div class="welcome">
                <h2>Welcome back</h2>
                <p>Sign in to manage your business</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-button">
                    Sign In →
                </button>

            </form>

            <form id="signupForm" style="display: none;">

    <div class="input-group">
        <label for="signupName">Your name</label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
            required
        >
    </div>

    <div class="input-group">
        <label for="signupBusiness">Business name</label>

        <input
            type="text"
            id="signupBusiness"
            placeholder="Enter your business name"
            required
        >
    </div>

    <div class="input-group">
        <label for="signupEmail">Email address</label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="input-group">
        <label for="signupPassword">Password</label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            required
        >
    </div>

    <div class="input-group">
        <label for="signupConfirmPassword">
            Confirm password
        </label>

        <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Confirm your password"
            required
        >
    </div>

    <button type="submit" class="login-button">
        Create Account →
    </button>

    <div class="create-account">
        <p>Already have an account?</p>

        <a href="#" id="backToLogin">
            Sign in
        </a>
    </div>

</form>

            <div class="create-account">
                <p>New to BusinessHub?</p>

               <a href="#" id="createAccountLink">
    Create a business account
</a>
            </div>

            <div class="eco-message">
                <span>🌱</span>
                <p>Built for businesses. Designed for a better planet.</p>
            </div>

        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
